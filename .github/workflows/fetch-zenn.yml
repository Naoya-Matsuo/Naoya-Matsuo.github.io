name: Fetch Zenn Articles

on:
  schedule:
    - cron: '0 15 * * *'   # 毎日 00:00 JST (= 15:00 UTC)
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Zenn articles
        run: |
          curl -s "https://zenn.dev/api/articles?username=maoya23&order=latest&count=100" \
            -o zenn_articles.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zenn_articles.json
          git diff --cached --quiet || git commit -m "chore: update Zenn articles"
          git push
